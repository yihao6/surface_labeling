<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Surface Labeling</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="home">
    <h1>Surface Labeling</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/start">
      <label>
        Root folder path
        <input type="text" name="root" size="60" placeholder="/path/to/ROOT" required>
      </label>
      <p class="hint">Must contain an <code>images/</code> subfolder of grayscale PNGs.</p>
      <button type="submit">Confirm</button>
    </form>
  </div>
</body>
</html>
